name: Release theme

# Keep the public theme release in sync with manifest.json.
# Obsidian requires an exact, unprefixed tag and both assets.
on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"

permissions:
  contents: write

concurrency:
  group: acid-xerox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify manifest version and test CSS
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/theme.test.mjs
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version must be unprefixed SemVer (example: 1.0.2), got: $VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"
            exit 1
          fi

      - name: Publish exact-version Obsidian release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already published."
            exit 0
          fi
          gh release create "$VERSION" \
            manifest.json theme.css \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Acid Xerox $VERSION"
