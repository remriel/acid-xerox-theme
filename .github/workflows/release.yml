name: Release theme

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest
        shell: bash
        run: |
          MANIFEST_VERSION=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [ "$MANIFEST_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) does not match tag (${GITHUB_REF_NAME})"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            manifest.json theme.css \
            --generate-notes \
            --title "Acid Xerox ${GITHUB_REF_NAME}"
